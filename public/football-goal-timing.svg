  <text x="1346" y="506" fill="#98f5a7" font-size="31" font-weight="700" font-family="Avenir Next, Helvetica, Arial, sans-serif" text-anchor="end">122</text>
  <text x="1030" y="558" fill="#f5f7f2" font-size="31" font-family="Avenir Next, Helvetica, Arial, sans-serif">Own goals</text>
